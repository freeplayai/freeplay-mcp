name: Publish to PyPI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.0"

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Type checking
        run: make type-check

      - name: Lint checking
        run: make lint-check

      - name: Determine release version
        id: release_version
        run: uv run python scripts/determine_version.py stable pypi

      - name: Confirm final version
        run: |
          final_version="${{ steps.release_version.outputs.version }}"
          echo "Final version to publish: $final_version"

      - name: Get latest version from PyPI
        id: pypi_version
        run: |
          pypi_version=$(uv run python scripts/version_utils.py get-pypi-latest pypi)
          echo "version=$pypi_version" >> $GITHUB_OUTPUT
          echo "PyPI version: $pypi_version"

      - name: Check if version already exists
        run: uv run python scripts/check_version.py "${{ steps.release_version.outputs.version }}" stable pypi

      - name: Set version for later steps
        id: version
        run: echo "version=${{ steps.release_version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Clean dist directory
        run: rm -rf dist/*

      - name: Build package
        run: uv build

      - name: Check build artifacts
        run: |
          echo "Built packages:"
          ls -la dist/

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        run: uv publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            Release v${{ steps.version.outputs.version }}

            Published to PyPI: https://pypi.org/project/freeplay-mcp/${{ steps.version.outputs.version }}/
          files: |
            dist/*.whl
            dist/*.tar.gz
